<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Red Hat 9 + 黑莓全功能完美版</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
.phone-screen{width:100%;max-width:850px;aspect-ratio:4/3;max-height:95vh;position:relative;overflow:hidden;background:#1a3a6b;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,0.9);border-radius:12px;border:4px solid #0a0a0a}
.desktop-bg{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 70% 30%,rgba(58,110,165,0.5) 0%,transparent 60%),radial-gradient(ellipse at 30% 70%,rgba(20,50,100,0.8) 0%,transparent 70%),linear-gradient(160deg,#142c4e 0%,#2a5a9c 45%,#0f1f3a 100%)}
.status-bar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:3px 10px;background:rgba(0,0,0,0.35);color:#e0e0e0;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.1);height:26px;flex-shrink:0}
.desktop{position:relative;z-index:10;flex:1;padding:14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;min-height:0}
.desktop::-webkit-scrollbar{width:4px}.desktop::-webkit-scrollbar-thumb{background:#3a6ea5;border-radius:4px}
.icon-item{display:flex;flex-direction:column;align-items:center;width:68px;cursor:pointer;touch-action:manipulation}
.icon-img{font-size:24px;margin-bottom:3px;filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.7));transition:transform 0.1s;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,0.4)}
.icon-item:active .icon-img{transform:scale(0.92)}
.icon-label{color:#fff;font-size:9px;text-align:center;line-height:1.2;padding:1px 2px;border:1px solid transparent;border-radius:3px}
.icon-item.selected .icon-label{background-color:#3a6ea5;border:1px dotted #fff}
.panel{position:relative;z-index:20;height:36px;background:linear-gradient(to bottom,#e8e8e8 0%,#d0d0d0 50%,#b8b8b8 100%);border-top:1px solid #fff;border-bottom:1px solid #808080;display:flex;align-items:center;padding:0 4px;flex-shrink:0;transition:transform 0.35s ease,opacity 0.35s ease}
.panel.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
.main-menu-btn{height:26px;padding:0 8px;display:flex;align-items:center;gap:5px;background:linear-gradient(to bottom,#f0f0f0,#c0c0c0);border:1px solid #808080;border-radius:4px;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #999;cursor:pointer;font-size:11px;font-weight:bold;color:#000;touch-action:manipulation}
.main-menu-btn::before{content:'🎩';font-size:15px}
.start-menu{position:absolute;bottom:36px;left:4px;width:180px;background:#f0f0f0;border:1px solid #808080;border-radius:5px 5px 0 0;z-index:30;display:none;box-shadow:3px -3px 10px rgba(0,0,0,0.4);overflow:hidden}
.start-menu.show{display:block}
.menu-header{background:linear-gradient(to bottom,#4a7abc,#2a5a9c);color:#fff;padding:6px 10px;font-weight:bold;font-size:11px}
.menu-item{padding:6px 12px;font-size:10px;color:#000;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #e0e0e0;touch-action:manipulation}
.menu-item:hover{background:#3a6ea5;color:#fff}
.taskbar{flex:1;display:flex;align-items:center;gap:3px;padding:0 5px;height:80%;margin-left:5px;border-left:1px solid #a0a0a0;border-right:1px solid #fff;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.taskbar::-webkit-scrollbar{display:none}
.task-item{display:flex;align-items:center;gap:2px;background:linear-gradient(to bottom,#d0d0d0,#b0b0b0);border:1px solid #808080;border-radius:3px;padding:2px 5px;height:22px;font-size:13px;color:#000;cursor:pointer;box-shadow:inset 1px 1px 0 #fff;touch-action:manipulation;flex-shrink:0}
.task-item.active{background:linear-gradient(to bottom,#a0b8d0,#7090b0);border-color:#204060;box-shadow:inset 1px 1px 3px rgba(0,0,0,0.5)}
.task-close{color:#a00;font-weight:bold;margin-left:2px;padding:0 2px;border-radius:2px;font-size:9px}
.workspace-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;width:18px;height:18px;background-color:#808080;border-top:1px solid #808080;border-left:1px solid #808080;border-right:1px solid #fff;border-bottom:1px solid #fff;flex-shrink:0;margin-right:5px}
.ws-cell{background:#d0d0d0;box-shadow:inset 1px 1px 0px #fff}.ws-cell.active{background:#4a7abc}
.system-tray{display:flex;align-items:center;gap:6px;background:#c8c8c8;height:80%;padding:0 7px;border-top:1px solid #909090;border-left:1px solid #909090;border-right:1px solid #fff;border-bottom:1px solid #fff;border-radius:3px;flex-shrink:0;font-size:10px}
.system-time{font-weight:bold;font-size:9px;line-height:1.1;text-align:center;color:#000}
.touchpad-wrapper{position:absolute;bottom:46px;right:12px;z-index:200;pointer-events:none;transition:bottom 0.35s ease}
.touchpad-wrapper.at-bottom{bottom:8px}
.touchpad{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(80,180,255,0.35),rgba(20,50,90,0.7));border:2px solid rgba(80,180,255,0.45);box-shadow:0 0 16px rgba(80,180,255,0.25);position:relative;cursor:pointer;pointer-events:auto;touch-action:none}
.touchpad .dir-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(80,180,255,0.4);transition:all 0.2s}
.touchpad .dot-up{top:6px;left:50%;transform:translateX(-50%)}
.touchpad .dot-down{bottom:6px;left:50%;transform:translateX(-50%)}
.touchpad .dot-left{left:6px;top:50%;transform:translateY(-50%)}
.touchpad .dot-right{right:6px;top:50%;transform:translateY(-50%)}
.touchpad .tp-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:rgba(180,220,255,0.6);pointer-events:none}
.touchpad.swiping-up .dot-up,.touchpad.swiping-down .dot-down,.touchpad.swiping-left .dot-left,.touchpad.swiping-right .dot-right{background:#80d0ff;box-shadow:0 0 10px #80d0ff}
.float-esc{position:absolute;bottom:46px;left:12px;z-index:200;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(80,180,255,0.35),rgba(20,50,90,0.7));border:2px solid rgba(80,180,255,0.45);color:#e0f0ff;font-size:11px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(80,180,255,0.25);touch-action:manipulation;transition:bottom 0.35s ease;letter-spacing:0.5px}
.float-esc.at-bottom{bottom:8px}
.float-esc:active{transform:scale(0.92)}
.bottom-handle{position:absolute;bottom:46px;right:76px;z-index:200;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(80,180,255,0.35),rgba(20,50,90,0.7));border:2px solid rgba(80,180,255,0.45);color:#e0f0ff;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(80,180,255,0.25);touch-action:manipulation;transition:bottom 0.35s ease}
.bottom-handle.at-bottom{bottom:8px}
.bottom-handle:active{transform:scale(0.92);background:radial-gradient(circle at 35% 30%,rgba(80,180,255,0.6),rgba(20,50,90,0.9))}
.modal-overlay{position:absolute;top:26px;bottom:0;left:0;right:0;background:rgba(10,20,35,0.95);z-index:100;display:none;justify-content:center;align-items:center;padding:0}
.modal-overlay.active{display:flex}
.modal-box{width:100%;height:100%;background:linear-gradient(160deg,#142c4e 0%,#1a3a6b 45%,#0f1f3a 100%);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.modal-header{background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(80,180,255,0.2);padding:4px 10px;display:flex;justify-content:space-between;align-items:center;min-height:30px;flex-shrink:0}
.modal-header h3{font-size:11px;color:#e0f0ff;display:flex;align-items:center;gap:5px;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
.window-controls{display:flex;gap:5px}
.window-controls button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#c0d8ec;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.window-controls .min-btn{color:#f0c040}.window-controls .close-btn{color:#f7768e}
.modal-body{flex:1;display:flex;flex-direction:column;overflow:hidden;color:#e0f0ff;padding:8px 8px 60px 8px;min-height:0}
.modal-body input,.modal-body textarea{background:rgba(0,0,0,0.4);border:1px solid rgba(80,180,255,0.3);color:#e0f0ff;border-radius:6px;padding:4px 8px;font-size:12px;outline:none;touch-action:auto}
.modal-body button{background:linear-gradient(135deg,rgba(80,180,255,0.2),rgba(80,180,255,0.1));border:1px solid rgba(80,180,255,0.4);color:#e0f0ff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;touch-action:manipulation}
.modal-body button.primary{background:linear-gradient(135deg,#3b82f6,#2a5a9c);border-color:#80d0ff}
.modal-body button.success{background:linear-gradient(135deg,#2a8a6a,#1a5a4a);border-color:#4cd9a0}
.modal-body button.danger{background:linear-gradient(135deg,#8a3a3a,#5a2020);border-color:#f7768e}
.calc-container{flex:1;display:flex;flex-direction:column;min-height:0;gap:6px}
.calc-display{background:rgba(0,0,0,0.4);border:1px solid rgba(80,180,255,0.2);border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;flex-shrink:0;height:52px;overflow:hidden}
.calc-expr{color:#8ab0d0;font-size:11px;text-align:right;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-result{color:#fff;font-size:22px;font-weight:700;text-align:right;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);gap:3px;min-height:0;overflow:hidden}
.calc-grid button{font-size:10px;padding:0;border-radius:4px;min-height:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-grid .op-btn{background:linear-gradient(135deg,rgba(42,90,156,0.6),rgba(20,50,100,0.6))}
.calc-grid .equals-btn{background:linear-gradient(135deg,#3b82f6,#2a5a9c)}
.calc-grid .clear-btn{background:linear-gradient(135deg,#8a3a3a,#5a2020)}
.calc-grid .fn-btn{background:linear-gradient(135deg,#2a8a6a,#1a5a4a)}
.ds-container{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.ds-messages{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid rgba(80,180,255,0.1);min-height:0}
.ds-msg{max-width:80%;padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.5}
.ds-msg.user{align-self:flex-end;background:linear-gradient(135deg,#3b82f6,#2a5a9c);color:#fff}
.ds-msg.ai{align-self:flex-start;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}
.ds-input{display:flex;gap:6px;flex-shrink:0}
.ds-input input{flex:1;height:30px}
.editor-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}
.editor-wrapper #editorContainer{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.editor-wrapper .ql-toolbar{background:rgba(0,0,0,0.4);border:1px solid rgba(80,180,255,0.2);border-radius:6px 6px 0 0;border-bottom:none;padding:3px;flex-shrink:0;display:flex;flex-wrap:wrap}
.editor-wrapper .ql-container{background:rgba(0,0,0,0.2);color:#e8f0f8;border:1px solid rgba(80,180,255,0.2);border-radius:0 0 6px 6px;border-top:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0}
.editor-wrapper .ql-editor{color:#e8f0f8;min-height:100%;font-size:12px}
.ql-stroke{stroke:#c0d8ec}.ql-fill{fill:#c0d8ec}
.editor-actions{display:flex;gap:4px;padding:6px 0 0 0;align-items:center;flex-wrap:wrap;flex-shrink:0}
.save-status{color:#6a9aba;font-size:10px;margin-right:auto}
#qrContainer{display:none;padding:6px;background:rgba(0,0,0,0.3);border:1px solid rgba(80,180,255,0.2);border-radius:6px;margin-top:6px;text-align:center;flex-shrink:0;max-height:45%;overflow-y:auto}
#qrContainer #qrcode{display:inline-block;background:#fff;padding:4px;border-radius:4px}
.reader-overlay{position:absolute;inset:0;z-index:500;display:none;flex-direction:column;background:#f5f0e1;color:#3a3a3a;transition:all 0.3s}
.reader-overlay.active{display:flex}
.reader-overlay.fullscreen{position:fixed;inset:0;border-radius:0;z-index:9999}
.reader-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(0,0,0,0.06);border-bottom:1px solid rgba(0,0,0,0.1);flex-shrink:0;flex-wrap:wrap;transition:opacity 0.3s}
.reader-toolbar.hidden{opacity:0;pointer-events:none}
.reader-toolbar .r-btn{background:rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.15);color:inherit;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;touch-action:manipulation;transition:all 0.15s}
.reader-toolbar .r-btn:hover{background:rgba(0,0,0,0.18)}
.reader-title{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:bold}
.reader-progress{font-size:10px;opacity:0.6}
.reader-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:30px 40px;min-height:0;font-family:Georgia,'Songti SC','SimSun',serif;line-height:1.9;letter-spacing:0.02em;transition:font-size 0.2s,line-height 0.2s}
.reader-content p{margin:0 0 1.2em;text-align:justify;text-indent:2em;word-break:break-word}
.reader-content h1,.reader-content h2,.reader-content h3,.reader-content h4,.reader-content h5,.reader-content h6{margin:1em 0 0.6em;text-indent:0;font-weight:bold}
.reader-content h1{font-size:1.5em}.reader-content h2{font-size:1.3em}.reader-content h3{font-size:1.15em}
.reader-content blockquote{margin:0.8em 0;padding:0.4em 1em;border-left:3px solid rgba(0,0,0,0.2);opacity:0.85;text-indent:0}
.reader-content ul,.reader-content ol{margin:0.6em 0 1em 1.5em}
.reader-content img{max-width:100%;height:auto;display:block;margin:1em auto;border-radius:6px}
.reader-content pre{background:rgba(0,0,0,0.06);padding:8px 12px;border-radius:6px;overflow-x:auto;text-indent:0}
.reader-content code{background:rgba(0,0,0,0.06);padding:1px 4px;border-radius:3px}
.reader-theme-kindle{background:#f5f0e1;color:#3a3a3a}
.reader-theme-white{background:#ffffff;color:#222222}
.reader-theme-green{background:#c7edcc;color:#2a3a2a}
.reader-theme-dark{background:#1a1a1a;color:#c0c0c0}
.reader-theme-dark pre,.reader-theme-dark code{background:rgba(255,255,255,0.08)}
.reader-theme-dark blockquote{border-left-color:rgba(255,255,255,0.2)}
.reader-theme-pink{background:#fce4ec;color:#4a2a3a}
.reader-overlay.reader-theme-dark .reader-toolbar{background:rgba(255,255,255,0.05);border-bottom-color:rgba(255,255,255,0.1)}
.reader-overlay.reader-theme-dark .reader-toolbar .r-btn{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.img-wrapper{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.img-preview{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(80,180,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:80px}
.img-preview img{max-width:100%;max-height:100%;object-fit:contain}
.img-thumbs{display:flex;gap:6px;padding:4px 0;overflow-x:auto;flex-shrink:0;height:58px}
.img-thumb{flex-shrink:0;width:50px;height:50px;border-radius:6px;border:2px solid transparent;overflow:hidden;touch-action:manipulation;cursor:pointer}
.img-thumb.active{border-color:#80d0ff}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.radio-container{flex:1;display:flex;flex-direction:row;gap:8px;overflow:hidden;min-height:0}
.radio-left{flex:1.3;display:flex;flex-direction:column;min-width:0;min-height:0}
.radio-right{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.radio-now{background:rgba(0,0,0,0.3);border:1px solid rgba(80,180,255,0.2);border-radius:8px;padding:10px;text-align:center;flex-shrink:0}
.radio-now .name{font-size:12px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radio-now .country{color:#8ab0d0;font-size:10px;margin-top:2px}
.radio-now .status{color:#6a9aba;font-size:10px;margin-top:4px}
.radio-controls{display:flex;justify-content:center;gap:16px;flex-shrink:0;padding-top:4px}
.radio-controls button{background:radial-gradient(circle at 35% 30%,rgba(80,180,255,0.3),rgba(20,50,90,0.6));border:2px solid rgba(80,180,255,0.45);border-radius:50%;color:#c0d8ec;font-size:16px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.station-list{flex:1;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid rgba(80,180,255,0.1);padding:4px;min-height:0}
.station-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);touch-action:manipulation}
.station-item.active{background:rgba(80,180,255,0.25);border-left:3px solid #80d0ff}
.station-item .s-name{font-size:11px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station-item .s-country{color:#8ab0d0;font-size:9px}
.word-container{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.word-tabs{display:flex;gap:4px;border-bottom:1px solid rgba(80,180,255,0.2);padding-bottom:4px;flex-shrink:0}
.word-tabs .tab-btn{background:transparent;border:none;color:#6a9aba;padding:3px 12px;font-size:11px;font-weight:600;cursor:pointer;border-radius:6px 6px 0 0}
.word-tabs .tab-btn.active{color:#80d0ff;background:rgba(80,180,255,0.15);border-bottom:2px solid #80d0ff}
.tab-content{display:none;flex-direction:column;flex:1;overflow:hidden;gap:6px;min-height:0}.tab-content.active{display:flex}
.stats{display:flex;gap:12px;font-size:10px;color:#8ab0d0;flex-shrink:0}
.stats .stat-item span{font-weight:700;color:#e0f0ff}
.stats .mastered{color:#4cd9a0}.stats .unmastered{color:#f7768e}
.input-row{display:flex;gap:4px;flex-shrink:0}
.input-row input{flex:1;height:28px;min-width:0}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.toolbar button{padding:3px 8px;font-size:10px}
.item-list{flex:1;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid rgba(80,180,255,0.1);padding:3px;min-height:0}
.item-list .empty-tip{color:#6a9aba;text-align:center;padding:16px;font-size:11px}
.word-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:11px}
.word-info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.word-info .word{font-weight:bold;flex-shrink:0}.word-info .meaning{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-badge{font-size:8px;padding:1px 6px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);flex-shrink:0}
.status-badge.mastered{background:rgba(76,217,160,0.2);color:#4cd9a0}

let touchStartX=0,touchStartY=0,isSwiping=false,isLongPress=false,longPressTimer=null,selectedDesktopIndex=0;
function onTouchStart(e){e.preventDefault();const r=touchpad.getBoundingClientRect();const t=e.touches?e.touches[0]:e;touchStartX=t.clientX-r.left;touchStartY=t.clientY-r.top;isSwiping=false;isLongPress=false;longPressTimer=setTimeout(()=>{isLongPress=true;},600);}
function onTouchMove(e){e.preventDefault();const r=touchpad.getBoundingClientRect();const t=e.touches?e.touches[0]:e;const x=t.clientX-r.left,y=t.clientY-r.top,dx=x-touchStartX,dy=y-touchStartY;if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}if(Math.sqrt(dx*dx+dy*dy)>12){isSwiping=true;touchpad.classList.remove('swiping-up','swiping-down','swiping-left','swiping-right');if(Math.abs(dx)>Math.abs(dy)){const dir=dx>0?'right':'left';touchpad.classList.add('swiping-'+dir);handleDpad(dir);}else{const dir=dy>0?'down':'up';touchpad.classList.add('swiping-'+dir);handleDpad(dir);}touchStartX=x;touchStartY=y;}}
function onTouchEnd(){if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}if(!isSwiping&&!isLongPress)handleDpad('enter');touchpad.classList.remove('swiping-up','swiping-down','swiping-left','swiping-right');isSwiping=false;isLongPress=false;}
touchpad.addEventListener('touchstart',onTouchStart,{passive:false});
touchpad.addEventListener('touchmove',onTouchMove,{passive:false});
touchpad.addEventListener('touchend',onTouchEnd);
touchpad.addEventListener('mousedown',onTouchStart);
touchpad.addEventListener('mousemove',(e)=>{if(e.buttons===1)onTouchMove(e);});
touchpad.addEventListener('mouseup',onTouchEnd);
document.getElementById('floatEsc').onclick=()=>{if(window.avIsOpen&&window.avIsOpen()){window.avClose&&window.avClose();return;}if(activeAppId)handleAppMinimize(activeAppId);};

function handleDpad(direction){
if(window.avIsOpen&&window.avIsOpen()){
  if(direction==='left'){window.avShowPrev&&window.avShowPrev();return;}
  if(direction==='right'){window.avShowNext&&window.avShowNext();return;}
  if(direction==='up'){const t=document.getElementById('avText');if(t)t.scrollBy({top:-60,behavior:'smooth'});return;}
  if(direction==='down'){const t=document.getElementById('avText');if(t)t.scrollBy({top:60,behavior:'smooth'});return;}
  if(direction==='enter'){window.avClose&&window.avClose();return;}
}
if(activeAppId){
const modal=document.getElementById(activeAppId+'Modal');if(!modal)return;
const scrollables=modal.querySelectorAll('.ds-messages,.station-list,.item-list,.article-body .col,.articles-grid,.futures-container,.img-thumbs,.ql-container,#neteaseListWrapper,#neteaseLyricWrapper,.modal-body');
if(direction==='up'||direction==='down'){scrollables.forEach(el=>{if(el.scrollHeight>el.clientHeight+5)el.scrollBy({top:direction==='up'?-80:80,behavior:'smooth'});});}
else if(direction==='left'||direction==='right'){
  if(activeAppId==='image'){if(direction==='left')window.prevImage&&window.prevImage();else window.nextImage&&window.nextImage();}
  else if(activeAppId==='model3d'){window.controlModel&&window.controlModel(direction);}
  else if(activeAppId==='netease'){if(direction==='left')nsPrev();else nsNext();}
}
else if(direction==='enter'){if(activeAppId==='netease')nsTogglePlay();else if(activeAppId==='model3d')window.controlModel&&window.controlModel('enter');}
return;}
const icons=Array.from(document.querySelectorAll('.icon-item'));if(icons.length===0)return;
if(direction==='enter'){if(icons[selectedDesktopIndex])icons[selectedDesktopIndex].click();return;}
const current=icons[selectedDesktopIndex],curRect=current.getBoundingClientRect();
let bestIdx=selectedDesktopIndex,bestDist=Infinity;
icons.forEach((el,i)=>{if(i===selectedDesktopIndex)return;const r=el.getBoundingClientRect();const dr=r.top-curRect.top,dc=r.left-curRect.left;let valid=false;if(direction==='up'&&dr<-10)valid=true;if(direction==='down'&&dr>10)valid=true;if(direction==='left'&&dc<-10)valid=true;if(direction==='right'&&dc>10)valid=true;if(!valid)return;const dist=Math.sqrt(dr*dr+dc*dc);if(dist<bestDist){bestDist=dist;bestIdx=i;}});
if(bestIdx!==selectedDesktopIndex){selectedDesktopIndex=bestIdx;icons.forEach((el,i)=>el.classList.toggle('selected',i===bestIdx));icons[bestIdx].scrollIntoView({block:'nearest',behavior:'smooth'});}}

document.addEventListener('keydown',function(e){
if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.closest('.ql-editor')){if(e.key==='Escape'){if(window.avIsOpen&&window.avIsOpen()){window.avClose&&window.avClose();return;}if(activeAppId)handleAppMinimize(activeAppId);}return;}
if(e.key==='ArrowUp'){e.preventDefault();handleDpad('up');}
else if(e.key==='ArrowDown'){e.preventDefault();handleDpad('down');}
else if(e.key==='ArrowLeft'){e.preventDefault();handleDpad('left');}
else if(e.key==='ArrowRight'){e.preventDefault();handleDpad('right');}
else if(e.key==='Enter'){e.preventDefault();handleDpad('enter');}
else if(e.key==='Escape'){e.preventDefault();if(window.avIsOpen&&window.avIsOpen()){window.avClose&&window.avClose();return;}if(activeAppId)handleAppMinimize(activeAppId);}});

function playAudio(text,lang='en-US',rate=0.85){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith(lang.split('-')[0]));if(v)u.voice=v;window.speechSynthesis.speak(u);}

function initCalculatorLogic(){let calcExpr='',calcResult='0';const calcExprEl=document.getElementById('calcExpr'),calcResultEl=document.getElementById('calcResult'),grid=document.getElementById('calcGrid');const buttons=[['sin','cos','tan','(','7','8','9','/'],['log','ln','sqrt',')','4','5','6','*'],['π','e','^','!','1','2','3','-'],['sin⁻¹','cos⁻¹','tan⁻¹','C','0','.','=','+']];buttons.forEach(row=>{row.forEach(label=>{const btn=document.createElement('button');btn.textContent=label;if(['+','-','*','/','^','!','(',')','π','e','sin','cos','tan','log','ln','sqrt','sin⁻¹','cos⁻¹','tan⁻¹'].includes(label))btn.className='op-btn';else if(label==='=')btn.className='equals-btn';else if(label==='C')btn.className='clear-btn';else if(label==='π'||label==='e')btn.className='fn-btn';btn.onclick=()=>handleCalcButton(label);grid.appendChild(btn);});});function handleCalcButton(label){if(label==='C'){calcExpr='';calcResult='0';updateCalcDisplay();return;}if(label==='='){try{let expr=calcExpr.replace(/π/g,'pi').replace(/e(?![xp])/g,'2.718281828459045').replace(/sin⁻¹/g,'asin').replace(/cos⁻¹/g,'acos').replace(/tan⁻¹/g,'atan').replace(/(\d+)!/g,'factorial($1)');const result=math.evaluate(expr);if(typeof result==='number'&&!isNaN(result)&&isFinite(result)){calcResult=String(Number(result.toFixed(10)));calcExpr=expr+' =';}else{calcResult='Error';}}catch(e){calcResult='Error';}updateCalcDisplay();return;}if(calcResult!=='0'&&!calcResult.includes('Error')){if(label.match(/[0-9.]/)){calcExpr='';calcResult='0';}}calcExpr+=label;updateCalcDisplay();}function updateCalcDisplay(){calcExprEl.textContent=calcExpr||' ';calcResultEl.textContent=calcResult;calcResultEl.style.color=calcResult==='Error'?'#f7768e':'#fff';}}

function initDeepSeekLogic(){const mc=document.getElementById('dsMessages'),inp=document.getElementById('dsInput'),btn=document.getElementById('dsSend');const rep=['你好！我是 DeepSeek AI 助手，很高兴为你服务。','这个问题很有意思，让我想想…… 🤔','根据我的知识，这是一个非常值得探讨的话题。','我建议你从多个角度思考这个问题。'];function getReply(t){const l=t.toLowerCase();if(l.includes('你好')||l.includes('hello'))return '你好！很高兴见到你！😊';return rep[Math.floor(Math.random()*rep.length)];}function send(){const t=inp.value.trim();if(!t)return;addMsg(t,'user');inp.value='';setTimeout(()=>addMsg(getReply(t),'ai'),500+Math.random()*1000);}function addMsg(t,s){const d=document.createElement('div');d.className='ds-msg '+s;d.textContent=t;mc.appendChild(d);mc.scrollTop=mc.scrollHeight;}btn.onclick=send;inp.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();send();}};}

function initRadioLogic(){const sl=document.getElementById('stationList'),cn=document.getElementById('curStation'),cc=document.getElementById('curCountry'),ps=document.getElementById('playerStatus'),pb=document.getElementById('playBtn'),sb=document.getElementById('stopBtn');const fb=[{name:'BBC Radio 1',country:'UK',url:'https://stream.live.vc.bbcmedia.co.uk/bbc_radio_one'},{name:'BBC Radio 2',country:'UK',url:'https://stream.live.vc.bbcmedia.co.uk/bbc_radio_two'},{name:'Classic FM',country:'UK',url:'https://stream.media.global/classicfm'},{name:'Deutschlandfunk',country:'Germany',url:'https://st01.sslstream.dlf.de/dlf/01/high/aac/stream.aac'}];async function fetchStations(){try{const r=await fetch('https://de1.api.radio-browser.info/json/stations/topclick/40');if(!r.ok)throw 0;const d=await r.json();if(d&&d.length>0)return d;return fb;}catch(e){return fb;}}function renderSt(sts){sl.innerHTML='';sts.forEach(st=>{const d=document.createElement('div');d.className='station-item';const n=st.name||'未命名',c=st.country||'未知',u=st.url_resolved||st.url||'';d.innerHTML='<div><div class="s-name">'+n+'</div><div class="s-country">'+c+'</div></div><div>▶</div>';d.onclick=()=>{if(u)playSt(st,u);};sl.appendChild(d);});}function playSt(st,url){if(window._radioAudio){window._radioAudio.pause();window._radioAudio=null;}try{const a=new Audio(url);a.crossOrigin='anonymous';a.addEventListener('playing',()=>{ps.textContent='● 播放中';});a.addEventListener('error',()=>{ps.textContent='⚠️ 连接失败';});cn.textContent=st.name||'未知';cc.textContent=st.country||'未知';ps.textContent='⏳ 连接中...';document.querySelectorAll('.station-item').forEach(el=>el.classList.remove('active'));a.play().catch(()=>{ps.textContent='⚠️ 失败';});window._radioAudio=a;}catch(e){ps.textContent='⚠️ 错误';}}pb.onclick=()=>{if(!window._radioAudio)return;if(window._radioAudio.paused){window._radioAudio.play();ps.textContent='● 播放中';}else{window._radioAudio.pause();ps.textContent='● 已暂停';}};sb.onclick=()=>{if(window._radioAudio){window._radioAudio.pause();window._radioAudio=null;ps.textContent='● 停止';}};fetchStations().then(d=>renderSt(d));}

function initModel3DLogic(){
  const ifr=document.getElementById('model3dIframe');
  if(!ifr)return;
  ifr.srcdoc=`<!DOCTYPE html>

<body>

<input type="file" id="fileInput" style="display:none" accept=".glb,.gltf,.obj,.stl">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"><\/script>
<script>
let scene,camera,renderer;
let defaultGroup=null,loadedModel=null;
let rotX=-0.4,rotY=0.6,zoom=4;
let isDragging=false,lastX=0,lastY=0;
let autoRotate=true;
let autoRotateTimer=null;
let wireframeOn=false;

function init(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0a1620,0.03);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,5000);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  defaultGroup=new THREE.Group();
  const boxGeo=new THREE.BoxGeometry(1.5,1.5,1.5);
  const boxMat=new THREE.MeshPhongMaterial({color:0x3b82f6,emissive:0x0a2a4f,shininess:120,specular:0x80d0ff,transparent:true,opacity:0.92});
  const cube=new THREE.Mesh(boxGeo,boxMat);
  defaultGroup.add(cube);
  const edges=new THREE.EdgesGeometry(boxGeo);
  const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x80d0ff}));
  cube.add(line);
  const sphereGeo=new THREE.SphereGeometry(0.35,32,32);
  const sphereMat=new THREE.MeshPhongMaterial({color:0xff80b0,emissive:0x661030,shininess:80});
  const innerSphere=new THREE.Mesh(sphereGeo,sphereMat);
  cube.add(innerSphere);
  defaultGroup.userData.cube=cube;
  defaultGroup.userData.innerSphere=innerSphere;
  const ringGeo=new THREE.TorusGeometry(2.2,0.03,16,100);
  const ringMat=new THREE.MeshBasicMaterial({color:0x80d0ff,transparent:true,opacity:0.5});
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.rotation.x=Math.PI/2;
  defaultGroup.add(ring);
  defaultGroup.userData.ring=ring;
  for(let i=0;i<6;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),new THREE.MeshBasicMaterial({color:0xff80b0,transparent:true,opacity:0.9}));
    const a=(i/6)*Math.PI*2;
    s.position.set(Math.cos(a)*2.2,0,Math.sin(a)*2.2);
    ring.add(s);
  }
  scene.add(defaultGroup);

  const l1=new THREE.PointLight(0x80d0ff,1.2,100);l1.position.set(5,5,5);scene.add(l1);
  const l2=new THREE.PointLight(0xff4080,0.8,100);l2.position.set(-5,-3,-5);scene.add(l2);
  const l3=new THREE.PointLight(0xffffff,0.4,100);l3.position.set(0,10,0);scene.add(l3);
  scene.add(new THREE.AmbientLight(0x606080,0.9));
  scene.add(new THREE.DirectionalLight(0xffffff,0.5));

  const fileInput=document.getElementById('fileInput');
  document.getElementById('btnUpload').onclick=()=>fileInput.click();
  fileInput.onchange=(e)=>{const f=e.target.files[0];if(!f)return;handleFile(f);fileInput.value='';};
  document.getElementById('btnReset').onclick=()=>resetView();
  document.getElementById('btnDefault').onclick=()=>restoreDefault();
  document.getElementById('btnWire').onclick=()=>toggleWireframe();

  renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;autoRotate=false;});
  renderer.domElement.addEventListener('mousemove',e=>{if(!isDragging)return;rotY+=(e.clientX-lastX)*0.01;rotX+=(e.clientY-lastY)*0.01;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('mouseup',()=>{isDragging=false;restartAutoRotate();});
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom+=e.deltaY*0.005;zoom=Math.max(1,Math.min(50,zoom));},{passive:false});

  renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;autoRotate=false;}},{passive:false});
  renderer.domElement.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&isDragging){rotY+=(e.touches[0].clientX-lastX)*0.01;rotX+=(e.touches[0].clientY-lastY)*0.01;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
    else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.sqrt(dx*dx+dy*dy);if(window._lastDist){zoom-=(dist-window._lastDist)*0.02;zoom=Math.max(1,Math.min(50,zoom));}window._lastDist=dist;}
  },{passive:false});
  renderer.domElement.addEventListener('touchend',()=>{isDragging=false;window._lastDist=null;restartAutoRotate();});
  renderer.domElement.addEventListener('dblclick',resetView);

  });

  window.addEventListener('resize',onResize);
  animate();
}

function handleFile(file){
  const name=file.name.toLowerCase();
  const ext=name.split('.').pop();
  showStatus('📂 读取中...',0);
  setProgress(10);
  const reader=new FileReader();
  reader.onerror=()=>{showStatus('❌ 文件读取失败',-1);setTimeout(hideStatus,2000);};

  if(ext==='glb'){
    reader.onload=(e)=>{
      setProgress(40);
      const loader=new THREE.GLTFLoader();
      loader.parse(e.target.result,'',(gltf)=>{setProgress(90);onModelLoaded(gltf.scene,file.name);},(err)=>{console.error(err);showStatus('❌ GLTF 解析失败',-1);setTimeout(hideStatus,2000);});
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='gltf'){
    reader.onload=(e)=>{
      try{
        const json=JSON.parse(e.target.result);
        const loader=new THREE.GLTFLoader();
        loader.parse(JSON.stringify(json),'',(gltf)=>{onModelLoaded(gltf.scene,file.name);},(err)=>{console.error(err);showStatus('❌ GLTF 需内嵌资源',-1);setTimeout(hideStatus,2000);});
      }catch(err){showStatus('❌ GLTF 格式错误',-1);setTimeout(hideStatus,2000);}
    };
    reader.readAsText(file);
  } else if(ext==='obj'){
    reader.onload=(e)=>{
      setProgress(40);
      try{
        const loader=new THREE.OBJLoader();
        const obj=loader.parse(e.target.result);
        setProgress(90);
        onModelLoaded(obj,file.name);
      }catch(err){console.error(err);showStatus('❌ OBJ 解析失败',-1);setTimeout(hideStatus,2000);}
    };
    reader.readAsText(file);
  } else if(ext==='stl'){
    reader.onload=(e)=>{
      setProgress(40);
      try{
        const loader=new THREE.STLLoader();
        const geo=loader.parse(e.target.result);
        geo.computeVertexNormals();
        const mat=new THREE.MeshPhongMaterial({color:0x5a9ae0,shininess:80,specular:0x80d0ff});
        const mesh=new THREE.Mesh(geo,mat);
        setProgress(90);
        onModelLoaded(mesh,file.name);
      }catch(err){console.error(err);showStatus('❌ STL 解析失败',-1);setTimeout(hideStatus,2000);}
    };
    reader.readAsArrayBuffer(file);
  } else {
    showStatus('❌ 不支持的格式',-1);
    setTimeout(hideStatus,2000);
  }
}

function onModelLoaded(object,name){
  if(loadedModel){scene.remove(loadedModel);disposeObj(loadedModel);loadedModel=null;}
  defaultGroup.visible=false;

  const box=new THREE.Box3().setFromObject(object);
  const size=new THREE.Vector3();box.getSize(size);
  const center=new THREE.Vector3();box.getCenter(center);
  const maxDim=Math.max(size.x,size.y,size.z);

  object.position.sub(center);
  const scale=3/maxDim;
  object.scale.multiplyScalar(scale);

  object.traverse((child)=>{
    if(child.isMesh){
      if(child.material){
        const mats=Array.isArray(child.material)?child.material:[child.material];
        mats.forEach(m=>{
          if(m.isMeshPhongMaterial||m.isMeshStandardMaterial||m.isMeshLambertMaterial){m.side=THREE.DoubleSide;}
          if(!m.color)m.color=new THREE.Color(0x5a9ae0);
        });
      }
    }
  });

  scene.add(object);
  loadedModel=object;
  loadedModel.userData.originalSize=maxDim;

  rotX=-0.4;rotY=0.6;
  zoom=Math.max(2,maxDim*1.6);
  autoRotate=false;
  restartAutoRotate(2000);

  document.getElementById('btnDefault').style.display='inline-block';
  const info=document.getElementById('modelInfo');
  const triCount=countTriangles(object);
  info.textContent='📦 '+name+' · '+(triCount>0?triCount.toLocaleString()+' 三角形':'')+' · 尺寸 '+size.x.toFixed(1)+'×'+size.y.toFixed(1)+'×'+size.z.toFixed(1);
  info.classList.add('show');

  setProgress(100);
  showStatus('✅ 加载成功',100);
  setTimeout(hideStatus,1200);
}

function countTriangles(obj){
  let n=0;
  obj.traverse(c=>{
    if(c.isMesh&&c.geometry){
      const g=c.geometry;
      if(g.index)n+=g.index.count/3;
      else if(g.attributes.position)n+=g.attributes.position.count/3;
    }
  });
  return Math.floor(n);
}

function disposeObj(obj){
  if(!obj)return;
  obj.traverse(c=>{
    if(c.geometry)c.geometry.dispose();
    if(c.material){
      const mats=Array.isArray(c.material)?c.material:[c.material];
      mats.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
    }
  });
}

function restoreDefault(){
  if(loadedModel){scene.remove(loadedModel);disposeObj(loadedModel);loadedModel=null;}
  defaultGroup.visible=true;
  rotX=-0.4;rotY=0.6;zoom=4;
  document.getElementById('btnDefault').style.display='none';
  document.getElementById('modelInfo').classList.remove('show');
  wireframeOn=false;
  document.getElementById('btnWire').classList.remove('active');
}

function toggleWireframe(){
  wireframeOn=!wireframeOn;
  document.getElementById('btnWire').classList.toggle('active',wireframeOn);
  const target=loadedModel||defaultGroup;
  target.traverse(c=>{
    if(c.isMesh&&c.material){
      const mats=Array.isArray(c.material)?c.material:[c.material];
      mats.forEach(m=>{m.wireframe=wireframeOn;});
    }
  });
}

function resetView(){rotX=-0.4;rotY=0.6;zoom=loadedModel?Math.max(2,loadedModel.userData.originalSize*1.6):4;}
function restartAutoRotate(delay){if(autoRotateTimer)clearTimeout(autoRotateTimer);autoRotateTimer=setTimeout(()=>{autoRotate=true;},delay||1500);}
function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}

function animate(){
  requestAnimationFrame(animate);
  if(autoRotate&&!isDragging){rotY+=0.004;rotX+=0.001;}
  const target=loadedModel||defaultGroup;
  if(target){target.rotation.x=rotX;target.rotation.y=rotY;}
  if(defaultGroup.visible){
    const c=defaultGroup.userData.cube,s=defaultGroup.userData.innerSphere,r=defaultGroup.userData.ring;
    if(c){c.rotation.x=rotX;c.rotation.y=rotY;}
    if(s){s.rotation.x=-rotX*2;s.rotation.y=-rotY*2;}
    if(r){r.rotation.z+=0.008;}
  }
  camera.position.set(0,0,zoom);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

function showStatus(text,progress){const s=document.getElementById('status');s.firstChild.textContent=text;s.classList.add('show');if(progress>=0)setProgress(progress);}
function hideStatus(){document.getElementById('status').classList.remove('show');}
function setProgress(p){const bar=document.getElementById('progressBar');if(bar)bar.style.width=Math.max(0,Math.min(100,p))+'%';}

init();
<\/script>
</body>
</html>`;
}

window.controlModel=function(dir){
  const ifr=document.getElementById('model3dIframe');
  if(!ifr||!ifr.contentWindow)return;
  let a=null;
  switch(dir){
    case 'up':    a={type:'rotate',x:-0.05,y:0}; break;
    case 'down':  a={type:'rotate',x:0.05,y:0};  break;
    case 'left':  a={type:'rotate',x:0,y:-0.05}; break;
    case 'right': a={type:'rotate',x:0,y:0.05};  break;
    case 'enter': a={type:'reset'}; break;
  }
  if(a)ifr.contentWindow.postMessage(a,'*');
};

/* ★★★ 文章 · Strapi 集成（多图 cover + 图片查看器）★★★ */
const STORAGE_KEY_STRAPI='strapiUrl';
const DEFAULT_STRAPI_URL='http://localhost:1337';

function getSavedStrapiUrl(){
  try{
    const v=localStorage.getItem(STORAGE_KEY_STRAPI);
    if(v)return v;
  }catch(e){}
  return window.STRAPI_URL||DEFAULT_STRAPI_URL;
}

function initArticlesLogic(){
  const urlInput=document.getElementById('articlesUrlInput');
  const saveBtn=document.getElementById('articlesSaveUrl');
  const reloadBtn=document.getElementById('articlesReload');
  const statusEl=document.getElementById('articlesStatus');
  const gridEl=document.getElementById('articlesGrid');
  const viewer=document.getElementById('articlesViewer');
  const avTitle=document.getElementById('avTitle');
  const avCount=document.getElementById('avCount');
  const avImg=document.getElementById('avImg');
  const avThumbs=document.getElementById('avThumbs');
  const avText=document.getElementById('avText');
  const avPrev=document.getElementById('avPrev');
  const avNext=document.getElementById('avNext');
  const avBack=document.getElementById('avBack');
  const avEmpty=document.getElementById('avEmpty');
  if(!urlInput||!saveBtn||!statusEl||!gridEl||!viewer)return;

  urlInput.value=getSavedStrapiUrl();

  let avImages=[];
  let avIndex=0;

  const getBase=()=>{
    const v=(urlInput.value||'').trim()||DEFAULT_STRAPI_URL;
    return v.replace(/\/+$/,'');
  };

  const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const fmtDate=(d)=>{
    if(!d)return '未知日期';
    const dt=new Date(d);
    if(isNaN(dt.getTime()))return '未知日期';
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  };

  const resolveImg=(url)=>{
    if(!url)return '';
    url=String(url).trim();
    if(!url)return '';
    if(/^(https?:)?\/\//i.test(url)||url.indexOf('data:')===0)return url;
    return getBase()+(url.charAt(0)==='/'?'':'/')+url;
  };

  // 从任意图片对象里挑出最佳 URL
  const pickUrl=(obj)=>{
    if(!obj)return '';
    if(typeof obj==='string')return obj;
    if(obj.url)return obj.url;
    const fmts=obj.formats;
    if(fmts){
      for(const k of ['large','medium','small','thumbnail']){
        if(fmts[k]&&fmts[k].url)return fmts[k].url;
      }
    }
    return '';
  };

  // ★ 统一把关系字段（单个/数组/嵌套 data）拍平为对象数组
  const toArray=(rel)=>{
    if(!rel)return [];
    if(rel.data){
      const d=Array.isArray(rel.data)?rel.data:[rel.data];
      return d.filter(Boolean).map(x=>{
        if(x&&x.attributes)return Object.assign({},x.attributes,{id:x.id});
        return x;
      });
    }
    if(Array.isArray(rel)){
      return rel.filter(Boolean).map(x=>{
        if(x&&x.attributes)return Object.assign({},x.attributes,{id:x.id});
        return x;
      });
    }
    if(rel&&rel.attributes)return [Object.assign({},rel.attributes,{id:rel.id})];
    return [rel];
  };

  // 兼容 Strapi v4/v5，同时把 cover 处理成数组
  const normalize=(item)=>{
    const at=item.attributes||item;
    const candidates=['cover','images','gallery','photos','pictures','media','image','thumbnail'];
    let covers=[];
    for(const key of candidates){
      if(at[key]){
        const arr=toArray(at[key]);
        if(arr.length){covers=arr;break;}
      }
    }
    return {
      id:item.id||item.documentId,
      title:at.title||at.name||'无标题',
      content:at.content||at.description||at.body||at.text||'',
      publishedAt:at.publishedAt||at.createdAt,
      covers,
      _raw:item
    };
  };

  // ★★★ 提取文章所有图片（含多图 cover + 正文内嵌）★★★
  const extractImages=(article)=>{
    const imgs=[];
    const push=(u)=>{
      if(!u)return;
      const full=resolveImg(u);
      if(full&&imgs.indexOf(full)===-1)imgs.push(full);
    };

    // 1) 多图 cover
    (article.covers||[]).forEach(c=>push(pickUrl(c)));

    // 2) 正文 HTML / Markdown
    const c=article.content;
    if(typeof c==='string'){
      let m;
      const reImg=/<img[^>]+src\s*=\s*["']([^"']+)["']/gi;
      while((m=reImg.exec(c))!==null)push(m[1]);
      const reMd=/!\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      while((m=reMd.exec(c))!==null)push(m[1]);
    }

    // 3) Strapi Blocks 结构
    if(Array.isArray(c)){
      const walk=(node)=>{
        if(!node)return;
        if(Array.isArray(node)){node.forEach(walk);return;}
        if(typeof node!=='object')return;
        if(node.type==='image')push(pickUrl(node.image));
        if(node.image)push(pickUrl(node.image));
        if(node.url)push(node.url);
        if(Array.isArray(node.children))node.children.forEach(walk);
      };
      c.forEach(walk);
    }

    // 4) content 是对象
    if(c&&typeof c==='object'&&!Array.isArray(c)){
      const walk=(node)=>{
        if(!node||typeof node!=='object')return;
        if(node.url)push(node.url);
        if(node.image)push(pickUrl(node.image));
        Object.keys(node).forEach(k=>{
          const v=node[k];
          if(v&&typeof v==='object')walk(v);
        });
      };
      walk(c);
    }

    return imgs;
  };

  const contentToText=(c)=>{
    if(!c)return '';
    if(typeof c==='string'){
      let s=String(c);
      s=s.replace(/<img[^>]*>/gi,'');
      s=s.replace(/!\[[^\]]*\]\([^)]*\)/g,'');
      s=s.replace(/<[^>]*>/g,' ');
      s=s.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
      s=s.replace(/\s+/g,' ').trim();
      return s;
    }
    if(Array.isArray(c)){
      const parts=[];
      const walk=(children)=>{
        if(!Array.isArray(children))return;
        children.forEach(ch=>{
          if(!ch)return;
          if(typeof ch.text==='string')parts.push(ch.text);
          if(ch.children)walk(ch.children);
        });
      };
      c.forEach(b=>{if(b&&b.children){walk(b.children);parts.push('\n');}});
      return parts.join('').replace(/\n{3,}/g,'\n\n').trim();
    }
    return '';
  };

  const render=(list)=>{
    if(!list.length){gridEl.innerHTML='<div class="articles-empty">📭 暂无文章</div>';return;}
    gridEl.innerHTML=list.map(a=>{
      const firstCover=a.covers&&a.covers[0]?resolveImg(pickUrl(a.covers[0])):'';
      const txt=esc(contentToText(a.content)).slice(0,160);
      const imgCount=extractImages(a).length;
      return `<div class="article-card">
        ${firstCover?`<img src="${esc(firstCover)}" alt="" onerror="this.style.display='none'">`:''}
        <div class="ac-body">
          <div class="ac-title">${esc(a.title)}</div>
          <div class="ac-content">${txt}</div>
          <div class="ac-date">📅 ${esc(fmtDate(a.publishedAt))} · 🖼️ ${imgCount}</div>
        </div>
      </div>`;
    }).join('');
    gridEl.querySelectorAll('.article-card').forEach((el,idx)=>{
      el.onclick=()=>openViewer(list[idx]);
    });
  };

  const renderThumbs=()=>{
    avThumbs.innerHTML=avImages.map((u,i)=>
      `<div class="av-thumb ${i===avIndex?'active':''}" data-i="${i}"><img src="${esc(u)}" alt="" onerror="this.style.opacity=0.25"></div>`
    ).join('');
    avThumbs.querySelectorAll('.av-thumb').forEach(el=>{
      el.onclick=()=>showImage(parseInt(el.dataset.i,10));
    });
  };

  const showImage=(i)=>{
    if(avImages.length===0)return;
    if(i<0)i=avImages.length-1;
    if(i>=avImages.length)i=0;
    avIndex=i;
    avImg.src=avImages[i];
    avImg.onerror=()=>{avImg.alt='图片加载失败：'+avImages[i];};
    avCount.textContent=(i+1)+'/'+avImages.length;
    avThumbs.querySelectorAll('.av-thumb').forEach((el,idx)=>el.classList.toggle('active',idx===i));
    const active=avThumbs.querySelector('.av-thumb.active');
    if(active&&active.scrollIntoView)active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  };

  const openViewer=(article)=>{
    avImages=extractImages(article);
    avIndex=0;
    avTitle.textContent=article.title||'文章';
    const txt=contentToText(article.content);
    avText.textContent=txt||'（无文字内容）';
    if(avImages.length===0){
      avImg.style.display='none';
      avImg.removeAttribute('src');
      avPrev.style.display='none';
      avNext.style.display='none';
      avThumbs.style.display='none';
      avThumbs.innerHTML='';
      avCount.textContent='0/0';
      avEmpty.style.display='flex';
      avEmpty.innerHTML='📭<br>这篇文章没有提取到图片<br><span style="font-size:10px;opacity:0.7;">打开控制台查看原始数据</span>';
      avText.style.flex='1 1 auto';
      avText.style.maxHeight='none';
      console.log('【文章无图片】原始数据：',article._raw);
    }else{
      avImg.style.display='block';
      avPrev.style.display='flex';
      avNext.style.display='flex';
      avThumbs.style.display='flex';
      avEmpty.style.display='none';
      avText.style.flex='0 0 auto';
      avText.style.maxHeight='35%';
      renderThumbs();
      showImage(0);
      console.log('【文章图片】提取到',avImages.length,'张：',avImages);
    }
    viewer.classList.add('active');
  };

  const closeViewer=()=>{
    viewer.classList.remove('active');
    avImg.removeAttribute('src');
    avImages=[];
    avIndex=0;
  };

  avBack.onclick=closeViewer;
  avPrev.onclick=()=>showImage(avIndex-1);
  avNext.onclick=()=>showImage(avIndex+1);

  window.avIsOpen=()=>viewer.classList.contains('active');
  window.avShowPrev=()=>showImage(avIndex-1);
  window.avShowNext=()=>showImage(avIndex+1);
  window.avClose=closeViewer;

  const load=async()=>{
    const base=getBase();
    statusEl.innerHTML=`<span>⏳ 正在从 ${esc(base)} 加载文章…</span>`;
    gridEl.innerHTML='';
    try{
      const res=await fetch(`${base}/api/articles?populate=*`);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      const raw=Array.isArray(json.data)?json.data:(json.data?[json.data]:[]);
      const list=raw.map(normalize);
      console.log('===== Strapi 原始数据 =====',raw);
      console.log('===== 规范化后 =====',list);
      render(list);
      statusEl.innerHTML=`<span>✅ 已加载 ${list.length} 篇文章</span><span style="opacity:.6;">· ${esc(base)}</span>`;
    }catch(err){
      gridEl.innerHTML=`<div class="articles-empty">⚠️ 无法连接 Strapi<br><br>当前地址：<b>${esc(base)}</b><br>错误：${esc(err.message||'加载失败')}</div>`;
      statusEl.innerHTML=`<span style="color:#f7768e;">❌ 加载失败</span>`;
    }
  };

  saveBtn.onclick=()=>{
    const v=urlInput.value.trim();
    if(!v){alert('请输入 Strapi 地址');return;}
    try{localStorage.setItem(STORAGE_KEY_STRAPI,v);}catch(e){}
    window.STRAPI_URL=v;
    load();
  };

  reloadBtn.onclick=()=>load();

  urlInput.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){e.preventDefault();saveBtn.click();}
  });

  load();
  window.refreshArticles=load;
}

updateTaskbar();
console.log('✅ 系统就绪。文章应用已支持 Strapi Multiple media 多图封面 + 图片查看器。');
</script>
</body>
</html>
